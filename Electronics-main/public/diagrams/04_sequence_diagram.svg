<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950">
  <rect width="1400" height="950" fill="#FFFFFF"/>
  
  <!-- Header -->
  <rect x="50" y="25" width="1300" height="55" rx="8" fill="#1E293B"/>
  <text x="700" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    ElectroStock - UML Sequence Diagram: POS Customer Sale &amp; Stock Deduction
  </text>

  <!-- Lifeline Boxes -->
  <!-- Cashier -->
  <rect x="70" y="110" width="140" height="40" rx="4" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="140" y="135" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">Cashier (User)</text>
  <line x1="140" y1="150" x2="140" y2="880" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Next.js POS UI -->
  <rect x="300" y="110" width="160" height="40" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="380" y="135" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0369A1" text-anchor="middle">Next.js POS UI</text>
  <line x1="380" y1="150" x2="380" y2="880" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- API Client -->
  <rect x="540" y="110" width="160" height="40" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="620" y="135" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0369A1" text-anchor="middle">api-client.ts</text>
  <line x1="620" y1="150" x2="620" y2="880" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Java Server -->
  <rect x="780" y="110" width="180" height="40" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="870" y="135" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1D4ED8" text-anchor="middle">Java REST Server</text>
  <line x1="870" y1="150" x2="870" y2="880" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- DataStore -->
  <rect x="1030" y="110" width="150" height="40" rx="4" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
  <text x="1105" y="135" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0F766E" text-anchor="middle">DataStore Service</text>
  <line x1="1105" y1="150" x2="1105" y2="880" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Oracle DB -->
  <rect x="1230" y="110" width="140" height="40" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="1300" y="135" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#B45309" text-anchor="middle">Oracle DB (XE)</text>
  <line x1="1300" y1="150" x2="1300" y2="880" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Step 1: Scan / Enter Item -->
  <line x1="140" y1="190" x2="380" y2="190" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="240" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1E293B" text-anchor="middle">1. Scan Barcode / SKU</text>

  <!-- Step 2: Fetch Product Info -->
  <line x1="380" y1="230" x2="620" y2="230" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="500" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1E293B" text-anchor="middle">2. getProduct(id)</text>

  <!-- Step 3: Forward GET -->
  <line x1="620" y1="260" x2="870" y2="260" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="745" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1E293B" text-anchor="middle">3. GET /api/products/{id}</text>

  <!-- Step 4: Product details return -->
  <line x1="870" y1="300" x2="380" y2="300" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
  <text x="625" y="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1E293B" text-anchor="middle">4. Return Product Details &amp; Live Stock</text>

  <!-- Step 5: Confirm Checkout -->
  <line x1="140" y1="360" x2="380" y2="360" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="250" y="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1E293B" text-anchor="middle">5. Confirm Sale &amp; Select Serial SN</text>

  <!-- Step 6: Dispatch POST -->
  <line x1="380" y1="410" x2="620" y2="410" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="500" y="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1E293B" text-anchor="middle">6. stockOut({productId, qty, price})</text>

  <!-- Step 7: POST to Java REST -->
  <line x1="620" y1="450" x2="870" y2="450" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="745" y="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1E293B" text-anchor="middle">7. POST /api/inventory/stock-out</text>

  <!-- Step 8: Call DataStore.stockOut -->
  <line x1="870" y1="490" x2="1105" y2="490" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="985" y="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1E293B" text-anchor="middle">8. stockOut(productId, qty, price, ...)</text>

  <!-- Self execution: Stock & Profit Calc -->
  <rect x="1100" y="520" width="10" height="50" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="1120" y="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0F766E">9. Validate Stock &gt;= Qty</text>
  <text x="1120" y="555" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0F766E">10. Calculate Profit/Loss (Sales - COGS)</text>

  <!-- Step 11: SQL Insert to Oracle -->
  <line x1="1105" y1="600" x2="1300" y2="600" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="1200" y="590" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">11. INSERT INTO transactions ...</text>

  <!-- Step 12: SQL Update Stock in Oracle -->
  <line x1="1105" y1="640" x2="1300" y2="640" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="1200" y="630" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">12. UPDATE products SET stock = ...</text>

  <!-- Step 13: SQL Update Serial in Oracle -->
  <line x1="1105" y1="680" x2="1300" y2="680" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="1200" y="670" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">13. UPDATE serial_imei (status='sold')</text>

  <!-- Step 14: Commit -->
  <line x1="1300" y1="720" x2="1105" y2="720" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
  <text x="1200" y="710" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#B45309" text-anchor="middle">14. Oracle COMMIT Successful</text>

  <!-- Step 15: Return to Server -->
  <line x1="1105" y1="760" x2="870" y2="760" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
  <text x="985" y="750" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1E293B" text-anchor="middle">15. Return {success: true, txn}</text>

  <!-- Step 16: HTTP 200 to UI -->
  <line x1="870" y1="800" x2="380" y2="800" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
  <text x="625" y="790" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0284C7" text-anchor="middle">16. HTTP 200 OK (Sale Completed)</text>

  <!-- Step 17: UI Updates & Prints Receipt -->
  <line x1="380" y1="840" x2="140" y2="840" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
  <text x="250" y="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#16A34A" text-anchor="middle">17. Print Receipt &amp; Digital Warranty</text>

  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E293B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>
</svg>