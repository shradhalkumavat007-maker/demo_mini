# ==============================================================================
# ElectroStock Java Backend Configuration (Production & Development Ready)
# ==============================================================================

server.port=${PORT:8080}
spring.application.name=electrostock-backend
logging.level.com.electrostock=INFO

# ------------------------------------------------------------------------------
# Production SQL Database Configuration (PostgreSQL / MySQL)
# ------------------------------------------------------------------------------
# By default, ElectroStock provides embedded persistence with automatic SQL schema initialization.
# For production PostgreSQL / MySQL deployment, set the environment variables below:
#
# DATABASE_URL=jdbc:postgresql://localhost:5432/electrostock
# DATABASE_USERNAME=postgres
# DATABASE_PASSWORD=yourpassword
#
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:electrostock;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ------------------------------------------------------------------------------
# Security & CORS
# ------------------------------------------------------------------------------
server.servlet.context-path=/
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,https://electrostock.vercel.app}
