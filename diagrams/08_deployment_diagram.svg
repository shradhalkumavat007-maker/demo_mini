<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 850" width="1350" height="850">
  <rect width="1350" height="850" fill="#FFFFFF"/>
  
  <!-- Header -->
  <rect x="50" y="25" width="1250" height="55" rx="8" fill="#1E293B"/>
  <text x="675" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    ElectroStock - UML Deployment Diagram
  </text>

  <!-- Node 1: Client Workstation -->
  <g transform="translate(80, 130)">
    <!-- 3D Node box -->
    <polygon points="0,20 20,0 300,0 280,20" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
    <polygon points="280,20 300,0 300,320 280,340" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="20" width="280" height="320" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    <text x="140" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">&lt;&lt;device&gt;&gt;</text>
    <text x="140" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Client Workstation / POS</text>
    <line x1="20" y1="85" x2="260" y2="85" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Artifact: Browser -->
    <rect x="25" y="105" width="230" height="75" rx="4" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.5"/>
    <text x="140" y="125" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">&lt;&lt;artifact&gt;&gt;</text>
    <text x="140" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">Chrome / Edge Browser</text>
    <text x="140" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">HTML5, CSS3, JS Client</text>

    <!-- Artifact: Barcode Scanner -->
    <rect x="25" y="195" width="230" height="55" rx="4" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
    <text x="140" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">USB / Camera Scanner</text>
    <text x="140" y="235" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Serial / Barcode Input</text>

    <!-- Artifact: Receipt Printer -->
    <rect x="25" y="260" width="230" height="55" rx="4" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
    <text x="140" y="283" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">POS Thermal Printer</text>
    <text x="140" y="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Customer Receipts</text>
  </g>

  <!-- Connection: Client to Next.js -->
  <line x1="380" y1="280" x2="480" y2="280" stroke="#0284C7" stroke-width="2"/>
  <text x="430" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0284C7" text-anchor="middle">HTTP :3000</text>

  <!-- Node 2: Web Server (Next.js) -->
  <g transform="translate(480, 130)">
    <polygon points="0,20 20,0 340,0 320,20" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
    <polygon points="320,20 340,0 340,320 320,340" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="20" width="320" height="320" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    <text x="160" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">&lt;&lt;device / execution environment&gt;&gt;</text>
    <text x="160" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Next.js Web Server</text>
    <line x1="20" y1="85" x2="300" y2="85" stroke="#E2E8F0" stroke-width="1.5"/>

    <rect x="25" y="105" width="270" height="95" rx="4" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.5"/>
    <text x="160" y="125" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">&lt;&lt;artifact&gt;&gt;</text>
    <text x="160" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">Next.js 13 Fullstack App</text>
    <text x="160" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Node.js Engine (Port 3000)</text>
    <text x="160" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">SSR &amp; API Route Handlers</text>

    <rect x="25" y="215" width="270" height="95" rx="4" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
    <text x="160" y="235" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">&lt;&lt;artifact&gt;&gt;</text>
    <text x="160" y="255" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">Prisma SQLite Dev Cache</text>
    <text x="160" y="275" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">electrostock.db</text>
    <text x="160" y="295" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Local fallback &amp; session store</text>
  </g>

  <!-- Connection: Next.js to Java -->
  <line x1="820" y1="280" x2="920" y2="280" stroke="#2563EB" stroke-width="2"/>
  <text x="870" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#2563EB" text-anchor="middle">REST :8085</text>

  <!-- Node 3: Java REST Application Server -->
  <g transform="translate(920, 130)">
    <polygon points="0,20 20,0 360,0 340,20" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
    <polygon points="340,20 360,0 360,320 340,340" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="20" width="340" height="320" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    <text x="170" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">&lt;&lt;device / execution environment&gt;&gt;</text>
    <text x="170" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F766E" text-anchor="middle">Java Application Server</text>
    <line x1="20" y1="85" x2="320" y2="85" stroke="#E2E8F0" stroke-width="1.5"/>

    <rect x="25" y="105" width="290" height="95" rx="4" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/>
    <text x="170" y="125" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D4ED8" text-anchor="middle">&lt;&lt;artifact&gt;&gt;</text>
    <text x="170" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">ElectroStock REST Server</text>
    <text x="170" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Java 26 SE Runtime (Port 8085)</text>
    <text x="170" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">JDK HttpServer + 16-Thread Pool</text>

    <rect x="25" y="215" width="290" height="95" rx="4" fill="#F8FAFC" stroke="#0F766E" stroke-width="1.5"/>
    <text x="170" y="235" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F766E" text-anchor="middle">&lt;&lt;artifact&gt;&gt;</text>
    <text x="170" y="255" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">Oracle JDBC Thin Driver</text>
    <text x="170" y="275" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">ojdbc14.jar (lib/ojdbc14.jar)</text>
    <text x="170" y="295" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">OracleDbService.class</text>
  </g>

  <!-- Connection: Java to Oracle DB (Vertical) -->
  <line x1="1090" y1="470" x2="1090" y2="550" stroke="#0D9488" stroke-width="2.5"/>
  <text x="1100" y="515" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0D9488">JDBC TCP :1521</text>

  <!-- Node 4: Database Server -->
  <g transform="translate(920, 550)">
    <polygon points="0,20 20,0 360,0 340,20" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
    <polygon points="340,20 360,0 360,230 340,250" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="20" width="340" height="230" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    <text x="170" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">&lt;&lt;device / database system&gt;&gt;</text>
    <text x="170" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F766E" text-anchor="middle">Oracle Database Host</text>
    <line x1="20" y1="85" x2="320" y2="85" stroke="#E2E8F0" stroke-width="1.5"/>

    <rect x="25" y="105" width="290" height="115" rx="4" fill="#F8FAFC" stroke="#0D9488" stroke-width="1.5"/>
    <text x="170" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F766E" text-anchor="middle">&lt;&lt;database environment&gt;&gt;</text>
    <text x="170" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">Oracle Database 10g XE</text>
    <text x="170" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#334155">• Service: OracleServiceXE (Port 1521)</text>
    <text x="170" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#334155">• Schema: system / 123456</text>
    <text x="170" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#334155">• Datafiles: SYSTEM.DBF, USERS.DBF</text>
  </g>
</svg>